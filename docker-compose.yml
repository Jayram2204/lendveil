services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-lendveil_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-lendveil_db}
      REDIS_URL: redis://redis:6379
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      ARCIUM_ENABLED: ${ARCIUM_ENABLED:-false}
      ARCIUM_RPC_URL: ${ARCIUM_RPC_URL:-https://api.devnet.solana.com}
      ARCIUM_MXE_PROGRAM_ID: ${ARCIUM_MXE_PROGRAM_ID:-}
      ARCIUM_MXE_PUBLIC_KEY_HEX: ${ARCIUM_MXE_PUBLIC_KEY_HEX:-}
      UNDERWRITING_PROGRAM_ID: ${UNDERWRITING_PROGRAM_ID:-}
      UNDERWRITING_AUTHORITY_KEY: ${UNDERWRITING_AUTHORITY_KEY:-}
      ONCHAIN_ANCHORING: ${ONCHAIN_ANCHORING:-false}
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:4000}
      NEXT_PUBLIC_SOLANA_RPC: ${NEXT_PUBLIC_SOLANA_RPC:-https://api.devnet.solana.com}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
